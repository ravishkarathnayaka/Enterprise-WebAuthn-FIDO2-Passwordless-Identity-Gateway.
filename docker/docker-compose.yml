version: '3.8'

services:
  # WebAuthn Relying Party & Reverse Proxy Gateway
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: webauthn_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RP_ID=localhost
      - RP_NAME=Enterprise WebAuthn Gateway
      - EXPECTED_ORIGIN=http://localhost:8000,https://localhost:8000,http://localhost:8443,https://localhost:8443
      - UPSTREAM_URL=http://upstream:8001
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///./data/gateway.db
      - JWT_SECRET_KEY=change-this-production-jwt-secret-key-fido2-enterprise
      - CHALLENGE_TIMEOUT_SECONDS=120
      - STEP_UP_MAX_AGE_SECONDS=60
    depends_on:
      - redis
      - upstream
    volumes:
      - gateway_db_data:/app/data
    networks:
      - identity_net

  # Upstream Protected Microservice (Behind Gateway)
  upstream:
    build:
      context: ../upstream_service
      dockerfile: Dockerfile
    container_name: upstream_protected_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - identity_net

  # Transient Challenge & Rate Limit Redis Cache
  redis:
    image: redis:7-alpine
    container_name: webauthn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - identity_net

  # Optional TLS Termination & Hardened Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: webauthn_nginx
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - identity_net

  # Prometheus Telemetry & SIEM Observability Collector
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: webauthn_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway
    networks:
      - identity_net

networks:
  identity_net:
    driver: bridge

volumes:
  gateway_db_data:
  redis_data:
  prometheus_data:
